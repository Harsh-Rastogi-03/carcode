[project]
name = "carcode"
version = "1.1.0"
description = "Hands-free Claude Code from Apple CarPlay via a Siri Shortcut"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "ASYNC230",  # opening a small log file inside start_proc is fine
    "SIM905",    # word lists read better as one string
]
