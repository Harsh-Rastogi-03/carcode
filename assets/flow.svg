<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4cc2ff"/>
    </marker>
  </defs>
  <rect width="1280" height="300" rx="24" fill="#0b1220"/>

  <!-- region labels -->
  <text x="60" y="44" font-size="14" font-weight="700" fill="#8b98ad" letter-spacing="2">IN YOUR CAR</text>
  <text x="520" y="44" font-size="14" font-weight="700" fill="#8b98ad" letter-spacing="2">ON YOUR MAC</text>
  <rect x="496" y="58" width="744" height="206" rx="18" fill="none" stroke="#24344f" stroke-dasharray="6 6"/>

  <g font-size="14" fill="#c9d3e3" text-anchor="middle">
    <!-- 1 phone -->
    <rect x="60" y="92" width="190" height="140" rx="18" fill="#13203a" stroke="#2a3c5c"/>
    <text x="155" y="130" font-size="30">🎙️</text>
    <text x="155" y="164" font-size="17" font-weight="700" fill="#ffffff">Siri Shortcut</text>
    <text x="155" y="188">dictates what you say,</text>
    <text x="155" y="208">speaks the reply</text>

    <!-- 2 tunnel -->
    <rect x="290" y="112" width="170" height="100" rx="18" fill="#13203a" stroke="#2a3c5c"/>
    <text x="375" y="148" font-size="16" font-weight="700" fill="#ffffff">HTTPS tunnel</text>
    <text x="375" y="172">Cloudflare, free</text>
    <text x="375" y="192">token-protected</text>

    <!-- 3 server -->
    <rect x="530" y="92" width="210" height="140" rx="18" fill="#13203a" stroke="#4cc2ff"/>
    <text x="635" y="130" font-size="30">⚡</text>
    <text x="635" y="164" font-size="17" font-weight="700" fill="#ffffff">carcode server</text>
    <text x="635" y="188">answers in under 8s,</text>
    <text x="635" y="208">joins half-sentences</text>

    <!-- 4 claude -->
    <rect x="780" y="92" width="210" height="140" rx="18" fill="#13203a" stroke="#2a3c5c"/>
    <text x="885" y="130" font-size="30">🧠</text>
    <text x="885" y="164" font-size="17" font-weight="700" fill="#ffffff">Claude Code</text>
    <text x="885" y="188">kept warm, one session</text>
    <text x="885" y="208">per device, remembers</text>

    <!-- 5 tools -->
    <rect x="1030" y="92" width="190" height="140" rx="18" fill="#13203a" stroke="#2a3c5c"/>
    <text x="1125" y="130" font-size="30">🛠️</text>
    <text x="1125" y="164" font-size="17" font-weight="700" fill="#ffffff">Your tools</text>
    <text x="1125" y="188">repos · git · gh</text>
    <text x="1125" y="208">Slack · Gmail · Drive</text>
  </g>

  <g stroke="#4cc2ff" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="252" y1="162" x2="286" y2="162"/>
    <line x1="462" y1="162" x2="526" y2="162"/>
    <line x1="742" y1="162" x2="776" y2="162"/>
    <line x1="992" y1="162" x2="1026" y2="162"/>
  </g>
</svg>
