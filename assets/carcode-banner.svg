<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="carcode: talk to Claude Code from your car">
<style>
.f{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.f{animation:none;opacity:1}}
</style>
<rect width="1280" height="400" fill="#ffffff"/>
<rect x=".5" y=".5" width="1279" height="399" fill="none" stroke="#e2e8f0"/>
<g class="f d1"><rect x="80" y="92" width="11" height="11" fill="#020617"/><text x="104" y="103" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2.4" fill="#334155">HEY SIRI, JARVIS</text></g>
<text class="f d2" x="74" y="218" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="112" font-weight="500" letter-spacing="-5" fill="#020617">carcode</text>
<text class="f d3" x="80" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#334155">Talk to Claude Code from your car.</text>
<text class="f d4" x="80" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.5" fill="#64748b">NO APP  ·  NO API KEY  ·  ONE-LINE INSTALL  ·  MIT</text>
<g class="f d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#020617">
  <text x="1200" y="150" text-anchor="end">review PRs</text>
  <text x="1200" y="186" text-anchor="end">read Slack and email</text>
  <text x="1200" y="222" text-anchor="end">ship code to draft PRs</text>
  <text x="1200" y="258" text-anchor="end">hands-free on CarPlay</text>
</g>
<line x1="1200" y1="120" x2="1200" y2="272" stroke="#020617" transform="translate(16 0)"/>
</svg>