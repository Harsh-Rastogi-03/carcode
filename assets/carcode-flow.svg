<rect x="64" y="110" width="204" height="150" fill="#ffffff" stroke="#020617"/><text x="84" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#020617">Siri Shortcut</text><text x="84" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">dictates what you say,</text><text x="84" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">speaks the reply</text><line x1="274" y1="185" x2="300" y2="185" stroke="#020617" stroke-width="1.5"/><path d="M294,179 L302,185 L294,191" fill="none" stroke="#020617" stroke-width="1.5"/><rect x="308" y="110" width="204" height="150" fill="#ffffff" stroke="#020617"/><text x="328" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#020617">HTTPS tunnel</text><text x="328" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Cloudflare, free,</text><text x="328" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">token-protected</text><line x1="518" y1="185" x2="544" y2="185" stroke="#020617" stroke-width="1.5"/><path d="M538,179 L546,185 L538,191" fill="none" stroke="#020617" stroke-width="1.5"/><rect x="552" y="110" width="204" height="150" fill="#ffffff" stroke="#020617"/><text x="572" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#020617">carcode server</text><text x="572" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">answers within 8s,</text><text x="572" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">joins half-sentences</text><line x1="762" y1="185" x2="788" y2="185" stroke="#020617" stroke-width="1.5"/><path d="M782,179 L790,185 L782,191" fill="none" stroke="#020617" stroke-width="1.5"/><rect x="796" y="110" width="204" height="150" fill="#020617" stroke="#020617"/><text x="816" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#ffffff">Claude Code</text><text x="816" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">kept warm, one session</text><text x="816" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">per device</text><line x1="1006" y1="185" x2="1032" y2="185" stroke="#020617" stroke-width="1.5"/><path d="M1026,179 L1034,185 L1026,191" fill="none" stroke="#020617" stroke-width="1.5"/><rect x="1040" y="110" width="204" height="150" fill="#ffffff" stroke="#020617"/><text x="1060" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#020617">Your tools</text><text x="1060" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">repos · git · gh</text><text x="1060" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Slack · Gmail · Drive</text>
<text x="64" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1" fill="#94a3b8">THE REPLY TRAVELS BACK THE SAME WAY AND IS SPOKEN BY SIRI</text>
