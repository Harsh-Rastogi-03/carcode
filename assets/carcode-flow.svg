<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Siri Shortcut in your car, to an HTTPS tunnel, to the carcode server, to Claude Code, to your tools, all on your Mac">
