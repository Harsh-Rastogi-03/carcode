<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="0.45" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#0a4f73"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- left: title -->
  <g transform="translate(80,0)">
    <text x="0" y="150" font-size="22" font-weight="600" fill="#4cc2ff" letter-spacing="3">HEY SIRI, JARVIS</text>
    <text x="0" y="232" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="-2">carcode</text>
    <text x="2" y="284" font-size="28" fill="#c9d3e3">Talk to Claude Code from your car.</text>
    <text x="2" y="322" font-size="20" fill="#8b98ad">Review PRs · read Slack · ship code · all hands-free on CarPlay</text>
    <g transform="translate(2,352)" font-size="15" font-weight="600">
      <rect width="118" height="32" rx="16" fill="#16233b" stroke="#24344f"/>
      <text x="59" y="21" text-anchor="middle" fill="#9fdcff">No app</text>
      <rect x="130" width="140" height="32" rx="16" fill="#16233b" stroke="#24344f"/>
      <text x="200" y="21" text-anchor="middle" fill="#9fdcff">No API key</text>
      <rect x="282" width="170" height="32" rx="16" fill="#16233b" stroke="#24344f"/>
      <text x="367" y="21" text-anchor="middle" fill="#9fdcff">5-minute setup</text>
    </g>
  </g>

  <!-- right: car screen -->
  <g transform="translate(720,58)">
    <rect width="480" height="324" rx="28" fill="#070b13" stroke="#24344f" stroke-width="2"/>
    <rect x="14" y="14" width="452" height="296" rx="18" fill="#0d1526"/>
    <circle cx="52" cy="52" r="18" fill="url(#orb)"/>
    <circle cx="52" cy="52" r="26" fill="none" stroke="#4cc2ff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="84" y="48" font-size="18" font-weight="700" fill="#e8eaed">Jarvis</text>
    <text x="84" y="68" font-size="13" fill="#3ddc97">● Listening</text>

    <g font-size="15">
      <rect x="196" y="96" width="250" height="40" rx="14" fill="#1f2a36"/>
      <text x="212" y="121" fill="#e8eaed">Any new issues on GitHub?</text>

      <rect x="34" y="150" width="340" height="62" rx="14" fill="#14223a" stroke="#24344f"/>
      <text x="50" y="176" fill="#e8eaed">Two since yesterday, Boss. The newest</text>
      <text x="50" y="198" fill="#e8eaed">is a chat widget refresh bug.</text>

      <rect x="226" y="226" width="220" height="40" rx="14" fill="#1f2a36"/>
      <text x="242" y="251" fill="#e8eaed">Fix it and open a PR.</text>
    </g>
    <!-- voice wave -->
    <g transform="translate(34,282)" fill="#4cc2ff">
      <rect x="0" y="-4" width="5" height="8" rx="2.5" opacity=".5"/>
      <rect x="9" y="-8" width="5" height="16" rx="2.5" opacity=".7"/>
      <rect x="18" y="-12" width="5" height="24" rx="2.5"/>
      <rect x="27" y="-7" width="5" height="14" rx="2.5" opacity=".8"/>
      <rect x="36" y="-10" width="5" height="20" rx="2.5"/>
      <rect x="45" y="-5" width="5" height="10" rx="2.5" opacity=".6"/>
      <rect x="54" y="-3" width="5" height="6" rx="2.5" opacity=".4"/>
    </g>
    <text x="104" y="287" font-size="13" fill="#8b98ad">One moment… working on it</text>
  </g>
</svg>
