name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run --group dev ruff check .
      - name: Test
        run: uv run --group dev pytest -q
      - name: Shell scripts
        run: bash -n carcode install.sh run_server.sh run_tunnel.sh
